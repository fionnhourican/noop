[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "noop-agent"
version = "0.1.0"
description = "NOOP Home Lab Windows 11 WHOOP 4.0 BLE collector background agent"
readme = "README.md"
authors = [{ name = "Fionn Hourican" }]
requires-python = ">=3.12"
dependencies = [
    "bleak>=0.21.0",
    "httpx>=0.27.0",
    "pystray>=0.19.5",
    "pillow>=10.2.0",
    "pyyaml>=6.0.1",
    "keyring>=24.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
noop-agent = "noop_agent.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["noop_agent*"]
